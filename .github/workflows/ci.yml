name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions: {}

jobs:
  ci:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-26.04, windows-2022, windows-2025, macos-26]
        toolchain: [stable]
        include:
          - {os: ubuntu-26.04, toolchain: '1.56.0'}
          - {os: ubuntu-26.04, toolchain: beta}
          - {os: ubuntu-26.04, toolchain: nightly}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu-')
        run: sudo apt install -y libpcsclite-dev

      - name: Setup toolchain
        shell: bash
        run: |
          rustup install "$TOOLCHAIN"
          rustup default "$TOOLCHAIN"
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}

      - name: Build pcsc-sys
        run: cargo build --verbose
        working-directory: pcsc-sys

      - name: Build pcsc
        run: cargo build --verbose
        working-directory: pcsc

      - name: Test pcsc
        run: cargo test --verbose
        working-directory: pcsc

      - name: Lint
        if: matrix.toolchain == 'stable'
        run: cargo clippy --verbose

      - name: Format
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check
